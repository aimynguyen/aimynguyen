name: Generate Snake Animation

on:
  schedule:
    # Chạy tự động vào lúc 00:00 mỗi ngày (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Cho phép bấm chạy thủ công
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Chạy action tạo ảnh SVG đóng góp hình rắn
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          # Xuất ra file SVG nền tối với rắn màu xanh matcha pastel (#6EE7B7)
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6EE7B7&color_dots=#131C18,#1A2E25,#047857,#10B981,#6EE7B7

      # 2. Đẩy ảnh vừa tạo lên nhánh "output"
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
