name: Generate 3D Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: aimynguyen
          SETTING_JSON: .github/contributions-pink.json

      - name: Save contribution chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/pink.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update 3D contribution chart"
            git push
          fi
